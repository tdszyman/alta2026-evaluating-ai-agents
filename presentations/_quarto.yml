# Visual style: _shared/style-brief.md. Change that before these themes.
# Published via GitHub Actions from `main` → GitHub Pages.
# Site URL: https://tdszyman.github.io/alta2026-evaluating-ai-agents/
#
# Routes:
#   /                home
#   /presentation/   deck landing; each part is its own deck URL
#   /hands-on/       site page; the app is copied to /hands-on/app/
#   /bibliography/   bibliography generated by scripts/build-knowledge.py
#   /about/          contributors and how the site runs
#   /organisation/   organiser mirror, not in the navbar; omitted from the
#                    build on and after 30 November 2026

project:
  type: website
  output-dir: _site
  resources:
    - robots.txt

website:
  title: "ALTA 2026"
  site-url: https://tdszyman.github.io/alta2026-evaluating-ai-agents
  description: "Evaluating AI Agents with LLM-as-a-Judge — ALTA 2026 Tutorial 2"
  page-navigation: false
  navbar:
    title: 'ALTA 2026<span class="brand-sub">Tutorial 2</span>'
    pinned: true
    left:
      - text: Home
        href: index.qmd
      - text: Presentation
        href: presentation/index.qmd
      - text: Hands-on
        href: hands-on/index.qmd
      - text: Bibliography
        href: bibliography/index.qmd
      - text: About
        href: about/index.qmd
  page-footer:
    left: "ALTA 2026 Tutorial 2 · 30 November 2026"
    right:
      - text: Program
        href: https://alta2026.alta.asn.au/program#afternoon-tutorial
      - text: About
        href: about/index.qmd

format:
  html:
    theme:
      light: [default, site.scss]
      dark: [default, site-dark.scss]
    toc: false
    # Stay in the current tab. The local preview host (127.0.0.1) is not
    # the published site URL, so Quarto would otherwise mark knowledge
    # links as external and open them in a new tab.
    link-external-newwindow: false
  revealjs:
    theme: [default, _shared/slides.scss]
    css: _shared/chrome.css
    include-after-body: _shared/chrome.html
    slide-number: false
    hash: true
    hash-type: title
    transition: fade
    navigation-mode: linear
    controls: true
    controls-layout: edges
    progress: true
    keyboard: true
    overview: true
    chalkboard: false
    code-line-numbers: true
    margin: 0.12
    width: 1280
    height: 720
