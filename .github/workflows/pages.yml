# Build Quarto presentations and deploy to GitHub Pages.
# Runs on push to main only (one site per repo; no per-branch previews).
# Site: https://tdszyman.github.io/alta2026-evaluating-ai-agents/
#
# One-time (repo owner): Settings → Pages → Source: GitHub Actions
# or: gh api repos/OWNER/REPO/pages -X POST -f build_type=workflow

name: Deploy presentations to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Test workshop evaluation and publishing assets
        run: node --test workshop/tests/*.test.mjs

      - name: Render presentations
        run: ./scripts/render-slides.sh all

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: presentations/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
